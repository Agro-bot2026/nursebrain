<!DOCTYPE html><html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0c0a1a"><title>NurseBrain — Nueva contraseña</title>
{% include '_auth_base.html' %}
</head><body>
<canvas id="lluvia"></canvas><span class="orb orb1"></span><span class="orb orb2"></span>
<form class="card" method="POST" action="/reset">
<input type="hidden" name="token" value="{{ token }}">
<div class="marca">Nurse<span class="g">Brain</span></div><div class="sub">Elegí una nueva contraseña</div>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<div class="campo"><label>Nueva contraseña</label><input type="password" name="password" required autofocus></div>
<button class="btn" type="submit">Guardar</button>
</form></body></html>
