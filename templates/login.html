<!DOCTYPE html><html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0c0a1a"><title>NurseBrain AI — Ingresar</title>
<meta property="og:title" content="NurseBrain AI">
<meta property="og:description" content="Tu copiloto de estudio para enfermería.">
<meta property="og:image" content="https://nursebrain.charly-tricks.dev/static/img/whatsapp-preview.jpg">
<link rel="manifest" href="/static/manifest.json">
{% include '_auth_base.html' %}
<script>
if(!localStorage.getItem('nb_onboarding_visto')){
  window.location.replace('/onboarding');
}
</script>
</head><body>
<canvas id="lluvia"></canvas><span class="orb orb1"></span><span class="orb orb2"></span>
<form class="card" method="POST" action="/login">
<img class="hero-img" src="https://nursebrain.charly-tricks.dev/static/img/icono-login.jpg" onerror="this.style.display='none'">
<div class="marca">Nurse<span class="g">Brain</span></div><div class="sub">Ingresá a tu cuenta</div>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<div class="campo"><label>Email</label><input type="email" name="email" required autofocus></div>
<div class="campo"><label>Contraseña</label><input type="password" name="password" required></div>
<button class="btn" type="submit">Ingresar</button>
<div class="links"><a href="/registro">Crear cuenta</a> · <a href="/recuperar">Olvidé mi contraseña</a></div>
</form></body></html>
